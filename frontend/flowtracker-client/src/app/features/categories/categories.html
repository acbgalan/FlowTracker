<div class="container my-3">
    <div class="row mb-3 align-items-center">
        <div class="col">
            <h2><i class="bi bi-tags"></i> Categorías</h2>
        </div>
        <div class="col text-end">
            <button type="button" class="btn btn-outline-primary  btn-sm" data-bs-toggle="modal"
                data-bs-target="#createCategoryModal"><i class="bi bi-plus-lg"></i> Nueva
                categoría</button>
        </div>
    </div>
    @if (errorMessage()) {
    <div class="alert alert-danger" role="alert">
        {{ errorMessage() }}
    </div>
    }

    @if (isLoading()) {
    <div class="text-secondary mb-3">Cargando categorías...</div>
    }

    <table class="table table-hover">
        <thead>
            <tr class="table-dark">
                <th scope="col">Tipo</th>
                <th scope="col">Nombre</th>
                <th scope="col">Descripción</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            @for (category of categories; track $index) {
            <tr>
                <td>{{category.type}}</td>
                <td>{{category.name}}</td>
                <td>{{category.description}}</td>
                <td class="text-end">
                    @if(category.userId != null){
                    <button type="button" class="btn btn-outline-secondary btn-sm"><i class="bi bi-pencil-square"></i>
                        Editar</button>&nbsp;
                    <button type="button" class="btn btn-outline-danger btn-sm" (click)="prepareDelete(category)"
                        data-bs-toggle="modal" data-bs-target="#deleteCategoryModal"><i class="bi bi-trash3"></i>
                        Eliminar</button>
                    }
                </td>
            </tr>
            }
        </tbody>
    </table>
    <nav aria-label="Categories navigation">
        <ul class="pagination justify-content-end">
            <li class="page-item">
                <a class="page-link" href="#" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item">
                <a class="page-link" href="#" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>

<app-create-category-modal (created)="getListData()"></app-create-category-modal>
<app-delete-category-modal [category]="categoryToDelete()" (deleted)="getListData()"></app-delete-category-modal>
